{% load widget_tweaks %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h1 class="text-center mb-4">Face Detector</h1>

  <div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          {{ form.image.label_tag }}
          {{ form.image|add_class:"form-control" }}
        </div>
        <button type="submit" class="btn btn-primary w-100">Upload & Detect</button>
        <a href="{% url 'live' %}" class="btn btn-success w-100 mt-2">Live Face Detection</a>
      </form>
    </div>
  </div>

  {% if result_img %}
    <div class="text-center mt-5">
      <h4 class="mb-3">Detected faces: {{ faces_count }}</h4>
      <img src="{{ result_img }}" alt="Result" class="img-fluid rounded shadow">
    </div>
  {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
